name: Deploy 3mdash.net

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "dither-hero.js"
      - "img/**"
      - "resume/**"
      - "dither/**"
      - "aerospace-ui/**"
      - "nesamovyto/**"
      - "khartiya/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p .cf-pages-deploy
          cp index.html .cf-pages-deploy/index.html
          cp styles.css .cf-pages-deploy/styles.css
          cp dither-hero.js .cf-pages-deploy/dither-hero.js
          cp -r img .cf-pages-deploy/img
          cp -r resume .cf-pages-deploy/resume
          cp -r dither .cf-pages-deploy/dither
          cp -r aerospace-ui .cf-pages-deploy/aerospace-ui
          cp -r nesamovyto .cf-pages-deploy/nesamovyto
          cp -r khartiya .cf-pages-deploy/khartiya

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy .cf-pages-deploy \
            --project-name resume-3mdash \
            --branch main