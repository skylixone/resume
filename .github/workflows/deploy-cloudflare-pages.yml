name: Deploy resume to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "me.jpg"
      - "img/**"
      - "resume/**"
      - "dither/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p .cf-pages-deploy/aerospace-ui .cf-pages-deploy/nesamovyto
          cp index.html .cf-pages-deploy/index.html
          cp styles.css .cf-pages-deploy/styles.css
          cp me.jpg .cf-pages-deploy/me.jpg
          cp -r img .cf-pages-deploy/img
          cp -r resume .cf-pages-deploy/resume
          cp -r dither .cf-pages-deploy/dither
          curl -sL https://github.com/skylixone/aerospace-ui/archive/refs/heads/main.tar.gz \
            | tar -xz --strip-components=1 -C .cf-pages-deploy/aerospace-ui \
              --exclude='.git*' --exclude='.Codex' --exclude='.claude' --exclude='.planning' \
              --exclude='_backup' --exclude='comments.json' --exclude='*.py' --exclude='*.zip'
          curl -sL https://github.com/skylixone/nesamovyto/archive/refs/heads/main.tar.gz \
            | tar -xz --strip-components=1 -C .cf-pages-deploy/nesamovyto \
              --exclude='.git*' --exclude='*.snap.txt' --exclude='.DS_Store' --exclude='.deploy.json'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy .cf-pages-deploy \
            --project-name resume-3mdash \
            --branch main