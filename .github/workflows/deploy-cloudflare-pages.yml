name: Deploy resume to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "index-ua.html"
      - "styles.css"
      - "me.jpg"
      - "_redirects"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p .cf-pages-deploy
          cp index.html .cf-pages-deploy/index.html
          cp index-ua.html .cf-pages-deploy/index-ua.html
          cp styles.css .cf-pages-deploy/styles.css
          cp me.jpg .cf-pages-deploy/me.jpg
          cp _redirects .cf-pages-deploy/_redirects

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy .cf-pages-deploy \
            --project-name resume-3mdash \
            --branch main