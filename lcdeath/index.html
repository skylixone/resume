<script>
"use strict";
window.onerror = (m, s, l) => {
  const e = document.getElementById("err");
  e.style.display = "flex"; e.textContent = "JS error: " + m + " @" + l;
};
/* ============================================================================
   CYMATICS LAB
   Analytic circular-membrane standing waves (Bessel modes) rendered through a
   fake-refraction optics pass: point lights below the dish, chromatic
   dispersion, and a free Helmholtz Laplacian caustic term.
   ========================================================================== */

/* ---------------- Bessel mode table ---------------- */
/* First roots of J_m(x) = 0 : alpha[m][n] */
const ROOTS = [
  [2.40483, 5.52008, 8.65373, 11.79153, 14.93092],   // m=0
  [3.83171, 7.01559, 10.17347, 13.32369, 16.47063],  // m=1
  [5.13562, 8.41724, 11.61984, 14.79595, 17.95982],  // m=2
  [6.38016, 9.76102, 13.01520, 16.22347, 19.40942],  // m=3
  [7.58834, 11.06471, 14.37254, 17.61597, 20.82693], // m=4
  [8.77148, 12.33860, 15.70017, 18.98013, 22.21780], // m=5
  [9.93611, 13.58929, 17.00382, 20.32079],           // m=6
  [11.08637, 14.82127, 18.28758, 21.64154],          // m=7
  [12.22509, 16.03777, 19.55454, 22.94517],          // m=8
  [13.35430, 17.24122, 20.80705],                    // m=9
];

function besselJ(m, x){
  if (x === 0) return m === 0 ? 1 : 0;
  let sum = Math.pow(x/2, m) / factorial(m);
  let term = sum;
  for (let k = 0; k < 80; k++){
    term *= -(x*x/4) / ((k+1)*(k+m+1));
    sum += term;
    if (Math.abs(term) < 1e-14) break;
  }
  return sum;
}
function factorial(n){ let f=1; for(let i=2;i<=n;i++) f*=i; return f; }
function besselJp(m, x){ // d/dx J_m
  if (m === 0) return -besselJ(1, x);
  return 0.5 * (besselJ(m-1, x) - besselJ(m+1, x));
}

/* Flatten mode list: [{m, alpha}] */
const MODES = [];
for (let m = 0; m < ROOTS.length; m++)
  for (const a of ROOTS[m]) MODES.push({ m, alpha: a });
MODES.splice(40);            // shader uniform array is sized 40
const NMODES = MODES.length;

/* ---------------- radial profile texture ---------------- */
const TEXW = 512; // radius samples

function buildProfileData(){
  // For each mode: normalized J_m(alpha*r) and its r-derivative (same norm)
  const rows = new Float32Array(NMODES * TEXW * 2);
  for (let i = 0; i < NMODES; i++){
    const { m, alpha } = MODES[i];
    const tmp = new Float64Array(TEXW), dtp = new Float64Array(TEXW);
    let maxAbs = 0;
    for (let j = 0; j < TEXW; j++){
      const r = j / (TEXW - 1);
      tmp[j] = besselJ(m, alpha * r);
      dtp[j] = alpha * besselJp(m, alpha * r);
      if (Math.abs(tmp[j]) > maxAbs) maxAbs = Math.abs(tmp[j]);
    }
    const inv = maxAbs > 0 ? 1 / maxAbs : 1;
    for (let j = 0; j < TEXW; j++){
      rows[(i * TEXW + j) * 2 + 0] = tmp[j] * inv;
      rows[(i * TEXW + j) * 2 + 1] = dtp[j] * inv;
    }
  }
  return rows;
}

/* float32 -> float16 */
function toHalf(v){
  const f32 = toHalf._f32 || (toHalf._f32 = new Float32Array(1));
  const u32 = toHalf._u32 || (toHalf._u32 = new Uint32Array(f32.buffer));
  f32[0] = v; const x = u32[0];
  const sign = (x >> 16) & 0x8000;
  let e = ((x >> 23) & 0xff) - 112;
  let m = x & 0x7fffff;
  if (e <= 0) return sign;            // flush tiny to zero
  if (e >= 31) return sign | 0x7bff;  // clamp
  return sign | (e << 10) | (m >> 13);
}
function floatToHalfArray(f32){
  const out = new Uint16Array(f32.length);
  for (let i = 0; i < f32.length; i++) out[i] = toHalf(f32[i]);
  return out;
}
</script>

<script>
"use strict";
/* ---------------- shaders ---------------- */

const VERT = `#version 300 es
void main(){
  vec2 v = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

uniform vec2  uRes;
uniform float uTime;

uniform sampler2D uModes;          // RG16F: (profile, dProfile/dr), rows = modes
uniform int   uCount;
uniform vec4  uModeA[${"40"}];     // m, alpha, amplitude, phase
uniform float uHScale;             // relief scale

uniform int   uLights;             // 0..4
uniform vec3  uLPos[4];            // dish coords, z < 0 (below surface)
uniform vec3  uLCol[4];
uniform float uLSharp;
uniform float uLHalo;

uniform float uDisp;               // chromatic dispersion delta
uniform float uWebK;               // caustic web strand weight (thickness)
uniform float uWebOp;              // caustic web opacity (0..1)
uniform vec3  uWebCol;
uniform float uShiftX;             // dish centre x as a fraction of canvas width
uniform float uExpo;
uniform float uGlow;
uniform vec3  uEnvA;               // ambient env gradient (psychedelic look)
uniform vec3  uEnvB;
uniform float uEnvK;

uniform float uDropMix;            // 0 = smooth liquid, 1 = droplet field
uniform float uDropScale;          // cells across dish diameter
uniform float uDropDome;           // dome steepness
uniform int   uDebug;              // 1 = visualize droplet mask
uniform float uSpecK;

out vec4 outColor;

const float ETA0 = 0.7518;         // 1 / 1.33

/* standing-wave field: returns (h, grad.x, grad.y, laplacian) */
vec4 field(vec2 p){
  float r = length(p);
  float theta = atan(p.y, p.x);
  float h = 0.0;
  vec2  grad = vec2(0.0);
  float lapl = 0.0;
  vec2 rhat = r > 1e-4 ? p / r : vec2(1.0, 0.0);
  vec2 that = vec2(-rhat.y, rhat.x);
  float invR = 1.0 / max(r, 0.03);

  for (int i = 0; i < 40; i++){
    if (i >= uCount) break;
    float m     = uModeA[i].x;
    float alpha = uModeA[i].y;
    float amp   = uModeA[i].z;
    float ph    = uModeA[i].w;
    vec2 pr = texture(uModes, vec2(clamp(r, 0.0, 1.0), (float(i) + 0.5) / 40.0)).rg;
    float ang = m * theta + ph;
    float ca = cos(ang), sa = sin(ang);
    h    += amp * pr.x * ca;
    grad += amp * (pr.y * ca) * rhat + amp * pr.x * (-m * sa) * invR * that;
    lapl += -alpha * alpha * amp * pr.x * ca;   // Helmholtz: lapl(mode) = -k^2 mode
  }
  return vec4(h, grad, lapl);
}

vec3 shade(vec2 p){
  vec4 F = field(p);
  float h = F.x;
  vec2 grad = F.yz;
  float lapl = F.w;

  vec3 N = normalize(vec3(-grad * uHScale, 1.0));
  float surfMask = 1.0;   // 1 = liquid surface visible, 0 = dark gap
  float rimRing = 0.0;    // droplet edge highlight

  /* ---- droplet layer: hex lattice of lens domes, sized by the carrier wave ---- */
  if (uDropMix > 0.001){
    vec2 sp = p * uDropScale;
    const vec2 S = vec2(1.0, 1.7320508);
    vec2 a = mod(sp, S) - 0.5 * S;
    vec2 b = mod(sp - 0.5 * S, S) - 0.5 * S;
    vec2 gv = dot(a, a) < dot(b, b) ? a : b;       // vector to cell centre
    vec2 center = (sp - gv) / uDropScale;          // dish coords of centre
    float Fc = abs(field(center).x);               // carrier amplitude there
    float Rc = 0.34 + 0.26 * clamp(Fc * 1.7, 0.0, 1.0);
    float d = length(gv) / Rc;
    float inD = 1.0 - smoothstep(0.9, 1.05, d);
    /* spherical-cap dome normal, gently perturbed by the carrier wave */
    vec3 Nd = normalize(vec3(gv / Rc * uDropDome, 1.0));
    Nd = normalize(Nd + vec3(-grad * uHScale * 0.25, 0.0));
    N = normalize(mix(N, Nd, uDropMix * inD));
    surfMask = mix(1.0, inD, uDropMix);
    rimRing = exp(-pow((d - 0.98) * 7.0, 2.0)) * uDropMix;
  }

  vec3 P = vec3(p, 0.0);
  vec3 I = vec3(0.0, 0.0, -1.0);   // camera ray into surface

  vec3 col = vec3(0.0);
  vec3 dbgLights = vec3(0.0);

  /* ---- point lights seen through the wavy surface (refraction + dispersion) ---- */
  for (int l = 0; l < 4; l++){
    if (l >= uLights) break;
    vec3 Ld = uLPos[l] - P;
    vec3 ld = normalize(Ld);
    /* distance falloff: each point is lit mostly by its nearest lamp, so
       overlapping halos keep their own hue instead of stacking to white */
    float fall = 1.0 / (1.0 + dot(Ld, Ld) * 3.0);
    vec3 acc = vec3(0.0);
    for (int c = 0; c < 3; c++){
      float dEta = (c == 0) ? uDisp : (c == 2 ? -uDisp : 0.0);
      vec3 refr = refract(I, N, ETA0 * (1.0 + dEta));
      float a = max(dot(normalize(refr), ld), 0.0);
      float core = pow(a, uLSharp) * fall;
      float halo = pow(a, uLSharp * 0.08) * uLHalo * fall;
      acc[c] = core + halo;
    }
    dbgLights += uLCol[l] * acc * surfMask;
  }
  if (uDebug == 2) return dbgLights;
  col += dbgLights;

  /* ---- caustic filament web along nodal contours ----
     Contour distance d = |h|/|grad h| (scale-invariant): 0 exactly on the
     nodal lines. Gaussian in d gives thin bright filaments with no wash.
     uWebK scales strand width (weight); a k-dependent blur term (quadrature
     sum) keeps low weights soft instead of razor-thin aliased hairlines.
     uWebOp scales overall opacity. */
  float d = abs(h) / (length(grad) + 1e-3);
  float s0 = uWebK * 0.008;
  float sigma = sqrt(s0 * s0 + pow(0.006 / (uWebK + 0.4) + 0.0012, 2.0));
  /* s0/sigma conserves energy: low weights blur wide AND faint (no wash) */
  float web = exp(-pow(d / sigma, 2.0)) * (s0 / max(sigma, 1e-5)) * smoothstep(0.005, 0.03, uWebK);
  /* clean edge: the field is clamped to zero at the boundary, so the rim is
     always a nodal contour and the web would hug it. Fade the web out first. */
  web *= 1.0 - smoothstep(0.85, 0.97, length(p));
  col += uWebCol * web * uWebOp * mix(1.0, 0.4, uDropMix);

  /* ---- droplet rim glints ---- */
  col += uWebCol * rimRing * 0.25;

  /* ---- top-side glints on crests ---- */
  vec3 L = normalize(vec3(0.35, 0.5, 0.8));
  float spec = pow(max(dot(reflect(-L, N), vec3(0.0, 0.0, 1.0)), 0.0), 90.0);
  col += vec3(0.9, 0.95, 1.0) * spec * 0.35 * surfMask * uSpecK;

  /* ---- ambient refracted environment (colour wash) ---- */
  vec3 refr = refract(I, N, ETA0);
  col += mix(uEnvA, uEnvB, refr.y * 0.5 + 0.5) * uEnvK * (0.4 + 0.6 * abs(h)) * surfMask;

  return col;
}

void main(){
  float mn = min(uRes.x, uRes.y);
  /* dish frame: 5% breathing room on the vertical edges; uShiftX = centre x
     as a fraction of the canvas (0.45 with sidebar open, 0.5 when collapsed) */
  vec2 ctr = vec2(uRes.x * uShiftX, uRes.y * 0.5);
  vec2 p = (gl_FragCoord.xy - ctr) / (mn * 0.45);
  float r = length(p);

  vec3 col;
  if (r <= 1.0){
    col = shade(p);
    /* dish vignette: soft matte falloff toward the rim (no drawn bezel) */
    col *= 1.0 - 0.25 * smoothstep(0.75, 1.0, r);
  } else {
    /* outside the dish: ambilight. The three lamps are the LEDs behind the
       dish; each spills a gaussian glow (diffuser), the halo is their
       mix at this point. Tight spread, soft radial tail. */
    vec3 edgeCol = vec3(0.0);
    if (r < 2.2){
      float t0 = atan(p.y, p.x);
      vec2 rimP = vec2(cos(t0), sin(t0));
      for (int l = 0; l < 3; l++){
        float d = length(uLPos[l].xy - rimP);
        edgeCol += uLCol[l] * exp(-pow(d / 0.42, 2.0));
      }
      edgeCol /= 2.2;
    }
    float x = r - 1.0;
    float halo = (0.5 + x) * exp(-x * 1.15) * (1.0 - smoothstep(1.7, 2.2, r));
    col = edgeCol * halo * 0.22;
  }

  /* no bezel: the dish edge is just the soft boundary between surface and void */

  /* glow (soft bloom approximation) */
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col += col * smoothstep(0.35, 1.6, lum) * uGlow;

  /* tonemap + gamma */
  col = vec3(1.0) - exp(-col * uExpo);
  col = pow(col, vec3(1.0 / 2.2));

  /* grain */
  float g = fract(sin(dot(gl_FragCoord.xy + uTime * 61.7, vec2(12.9898, 78.233))) * 43758.5453);
  col += (g - 0.5) * 0.028;

  outColor = vec4(col, 1.0);
}`;

/* ---------------- GL setup ---------------- */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });

function fail(msg){
  const e = document.getElementById("err");
  e.style.display = "flex"; e.textContent = msg;
  throw new Error(msg);
}
if (!gl) fail("WebGL2 is not available in this browser.");

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    fail("Shader error: " + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  fail("Link error: " + gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());

/* mode profile texture */
const modeTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, modeTex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, TEXW, NMODES, 0, gl.RG, gl.HALF_FLOAT,
              floatToHalfArray(buildProfileData()));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.uniform1i(gl.getUniformLocation(prog, "uModes"), 0);
gl.activeTexture(gl.TEXTURE0);

/* uniform locations */
const U = {};
["uRes","uTime","uCount","uHScale","uLights","uLSharp","uLHalo","uDisp","uWebK",
 "uWebOp","uWebCol","uShiftX","uExpo","uGlow","uEnvA","uEnvB","uEnvK","uModeA","uLPos","uLCol",
 "uDropMix","uDropScale","uDropDome","uDebug","uSpecK"]
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));
</script>

<script>
"use strict";
/* ---------------- excitation model ----------------
   eigenfrequency ~ alpha (scaled); Lorentzian resonance around drive freq.
   External audio driver can later write state.freq / state.amp directly.   */
const FSCALE = 28;               // Hz per unit alpha
const EIG = MODES.map(md => md.alpha * FSCALE);

function hash(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------------- state + presets ---------------- */
const state = {
  freq: 300, gamma: 55, amp: 1.1, hscale: 0.6, speed: 0.3,
  disp: 0.012, web: 0.35, webOp: 1, expo: 1.4, glow: 0.5,
  lint: 1.0, orbit: false, orbitSpeed: 0.25,
  lightCol: ["#ffb040", "#c02010", "#401858"],
  envA: [0.0, 0.0, 0.0], envB: [0.0, 0.0, 0.0], envK: 0.0,
  lightPos: [ [0.15, 0.05, -0.6], [-0.7, 0.6, -1.2], [0.5, -0.6, -1.0] ],
  lsharp: 60, lhalo: 0.35,
  webCol: [1.0, 0.85, 0.6],
  dropMix: 0, dropScale: 14, dropDome: 2.2,
  specK: 1.0,
  playing: true,
};
const DEFAULT_STATE = JSON.parse(JSON.stringify(state)); // pristine factory values for the "default" button

function hex2rgb(h){
  return [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
}
function rgb2hex(c){
  return "#" + c.map(v => Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,"0")).join("");
}

/* Built-in fallback presets (used when presets.json is missing).
   Kept in sync with presets.json — user-dialed defaults, baked 2026-09-27. */
let PRESETS = {
  honeycomb: {
    freq: 141, gamma: 25, amp: 2.05, hscale: 1.06, speed: 0.42,
    disp: 0.06, web: 1.16, webOp: 0.8, expo: 1.65, glow: 1.21, lint: 2.61,
    orbit: true, orbitSpeed: 0.03,
    lsharp: 120, lhalo: 0.08,
    lightPos: [[0.12, 0.06, -0.55], [-0.75, 0.65, -1.3], [0.6, -0.7, -1.1]],
    lightCol: ["#ff7b00", "#be0416", "#b30c00"],
    webCol: [0.30196078431372547, 0.1803921568627451, 0.0],
    envA: [0,0,0], envB: [0,0,0], envK: 0,
    dropMix: 0.09, dropScale: 10, dropDome: 2.6, specK: 0.7,
  },
  flower: {
    freq: 95, gamma: 14, amp: 1.6, hscale: 1.1, speed: 0.18,
    disp: 0.016, web: 0.05, webOp: 0.8, expo: 1.2, glow: 0.35, lint: 0.75,

/* Fetch presets.json to override the built-ins. Pushing presets.json updates defaults. */

function deepEqual(a, b){
  if (a === b) return true;
  if (typeof a !== typeof b || a == null || b == null) return false;
  if (Array.isArray(a)){
    if (!Array.isArray(b) || a.length !== b.length) return false;
    return a.every((v, i) => deepEqual(v, b[i]));
  }
  if (typeof a === "object"){
    const ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    return ka.every(k => kb.includes(k) && deepEqual(a[k], b[k]));
  }
  return false;
}

let activePreset = "filament";
var activeReading = null; // set by the readings block (string-derived states)
let FACTORY_PRESETS = null; // pristine presets.json/built-ins, captured before saved overrides merge

/* ---- persistence (localStorage) ----
   Working state survives refreshes; "save" overwrites the selected preset. */
const LS_STATE = "cymatics.state";
const LS_PRESETS = "cymatics.presets";
let saveTimer = null;
function persistState(){
  clearTimeout(saveTimer);

}

const SLIDERS = ["freq","gamma","amp","hscale","speed","disp","web","webOp","expo","glow","lint","orbitSpeed","dropMix","dropScale"];
const $ = id => document.getElementById(id);

function setFill(el, v){
  const min = parseFloat(el.min), max = parseFloat(el.max);
  const pct = max > min ? ((v - min) / (max - min)) * 100 : 50;

}

function hexOr(c){ return Array.isArray(c) ? rgb2hex(c) : c; }
function fmt(k, v){
  if (k === "freq") return Math.round(v) + "Hz";
  if (k === "disp") return v.toFixed(3);
  return (+v).toFixed(2);
}
for (const k of SLIDERS){

let FREEZE = null;
window.__bootDone = (async function boot(){
  await loadPresets();
  FACTORY_PRESETS = JSON.parse(JSON.stringify(PRESETS)); // before saved overrides merge
  /* user-modified presets survive refreshes (from "save") */
  try {
    const lp = JSON.parse(localStorage.getItem(LS_PRESETS));
    if (lp && typeof lp === "object") Object.assign(PRESETS, lp);
  } catch(e){}
  if (qs.get("preset") && PRESETS[qs.get("preset")]) applyPreset(qs.get("preset"));
  else applyPreset("filament");
  /* tuning overrides: ?freq=420&web=1.2&lsharp=120... */
  for (const k of ["freq","gamma","amp","hscale","speed","disp","web","webOp","expo","glow","lint","orbitSpeed","lsharp","lhalo","dropMix","dropScale","dropDome","specK"])
    if (qs.has(k)) state[k] = parseFloat(qs.get(k));
  FREEZE = qs.has("freeze") ? parseFloat(qs.get("freeze")) : null;

  /* saved session on a plain refresh — only when the URL did not pick a state */
  if (!qs.get("preset") && !qs.get("reading")){
    try {
      const blob = JSON.parse(localStorage.getItem(LS_STATE));
      if (blob && blob.state && typeof blob.state === "object"){
        Object.assign(state, blob.state);
        state.playing = true;
        const sp = $("statepick");
        if (sp){
          if (blob.reading && READINGS[blob.reading]) sp.value = "r:" + blob.reading;
          else if (blob.preset && PRESETS[blob.preset]) sp.value = "p:" + blob.preset;
          else sp.value = "";
        }
        activePreset = (blob.preset && PRESETS[blob.preset]) ? blob.preset : null;
        activeReading = (blob.reading && READINGS[blob.reading]) ? blob.reading : null;
        syncUI();
      }
    } catch(e){}
  }

  requestAnimationFrame(frame);
})();

/* ---------------- per-frame excitation ---------------- */
const modeA = new Float32Array(40 * 4);
const lpos  = new Float32Array(4 * 3);
const lcol  = new Float32Array(4 * 3);
const phaseOff = new Float32Array(NMODES); // integrated per-mode phase offset (speed changes stay continuous)

function excite(dt){
  let maxW = 0;
  const w = new Float32Array(NMODES);
  for (let i = 0; i < NMODES; i++){
    const d = (state.freq - EIG[i]) / state.gamma;
    w[i] = state.amp / (1 + d * d) * (0.65 + 0.7 * hash(i));
    if (w[i] > maxW) maxW = w[i];
  }
  const norm = maxW > 1e-6 ? state.amp / maxW : 0;
  for (let i = 0; i < NMODES; i++){
    const dir = hash(i + 50) > 0.5 ? 1 : -1;
    const drift = state.speed * dir * (0.15 + 0.5 * hash(i + 90));
    phaseOff[i] += dt * drift; // integrate: adjusting speed only changes the rate from now on
    modeA[i*4+0] = MODES[i].m;
    modeA[i*4+1] = MODES[i].alpha;
    modeA[i*4+2] = w[i] * norm;
    modeA[i*4+3] = hash(i + 7) * 6.2832 + phaseOff[i];
  }
}

/* ---------------- render loop ---------------- */
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener("resize", resize);

let t0 = performance.now(), simT = FREEZE ?? 0, last = t0;
let orbitAngle = 0;  // integrated orbit angle (continuous on toggle, unlike simT-based jumps)
let orbitRamp  = 0;  // 0..1 — soft ellipse/waver fades in after orbit toggle, so the start is exact
let dishShiftX = 0.45; // dish centre x as a fraction of canvas width (0.5 when sidebar hidden)
let dishShiftFrom = 0.45, dishShiftTo = 0.45, dishShiftT = 0; // tween state (panel slide)

/* the panel's cubic-bezier(.4,0,.2,1), sampled — used to slide the dish in sync */
const PANEL_EASE = (() => {
  const arr = new Float32Array(65);
  for (let i = 0; i <= 64; i++){
    const p = i / 64;
    let lo = 0, hi = 1;
    for (let k = 0; k < 20; k++){
      const m = (lo + hi) / 2;
      const xt = 3*(1-m)*(1-m)*m*0.4 + 3*(1-m)*m*m*0.2 + m*m*m;
      if (xt < p) lo = m; else hi = m;
    }
    const t = (lo + hi) / 2;
    arr[i] = 3*(1-t)*t*t + t*t*t;
  }
  return arr;
})();
function easePanel(p){
  const f = p * 64, i = Math.min(63, f | 0);
  return PANEL_EASE[i] + (PANEL_EASE[i+1] - PANEL_EASE[i]) * (f - i);
}

function frame(now){
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  /* dish shift tween — same 0.45s curve as the panel slide */
  if (dishShiftX !== dishShiftTo){
    const p = Math.min(1, (now - dishShiftT) / 450);
    dishShiftX = dishShiftFrom + (dishShiftTo - dishShiftFrom) * easePanel(p);
    if (p >= 1) dishShiftX = dishShiftTo;
  }
  const adv = FREEZE === null && state.playing;
  if (adv) simT += dt;

  resize();
  excite(adv ? dt : 0);

  /* lights */
  const nL = 3;
  for (let i = 0; i < 3; i++){
    let [x, y, z] = state.lightPos[i];
    if (state.orbit){
      if (adv){ orbitAngle += dt * state.orbitSpeed; orbitRamp = Math.min(1, orbitRamp + dt * 0.8); }
      const a = orbitAngle + i * 2.094;
      const rr = Math.hypot(x, y);
      /* soft ellipse (cos 2θ) + gentle higher-harmonic waver, per-light phase */
      const wob = 0.045 * Math.sin(2.0 * a + i * 1.31) + 0.03 * Math.sin(3.0 * a - i * 0.87);
      const ell = 0.05 * Math.cos(2.0 * a + i * 0.53);
      const k = orbitRamp * (wob + ell);
      x = rr * Math.cos(a) * (1.0 + k);
      y = rr * Math.sin(a) * (1.0 + k);
    }
    lpos[i*3+0] = x; lpos[i*3+1] = y; lpos[i*3+2] = z;
    const c = hex2rgb(hexOr(state.lightCol[i]));
    lcol[i*3+0] = c[0] * state.lint; lcol[i*3+1] = c[1] * state.lint; lcol[i*3+2] = c[2] * state.lint;
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uShiftX, dishShiftX);
  gl.uniform1f(U.uTime, simT);
  gl.uniform1i(U.uCount, NMODES);
  gl.uniform4fv(U.uModeA, modeA);
  gl.uniform1f(U.uHScale, state.hscale);
  gl.uniform1i(U.uLights, nL);
  gl.uniform3fv(U.uLPos, lpos);
  gl.uniform3fv(U.uLCol, lcol);
  gl.uniform1f(U.uLSharp, state.lsharp);
  gl.uniform1f(U.uLHalo, state.lhalo);
  gl.uniform1f(U.uDisp, state.disp);
  gl.uniform1f(U.uWebK, state.web);
  gl.uniform1f(U.uWebOp, state.webOp);
  gl.uniform3fv(U.uWebCol, state.webCol);
  gl.uniform1f(U.uExpo, state.expo);
  gl.uniform1f(U.uGlow, state.glow);
  gl.uniform3fv(U.uEnvA, state.envA);
  gl.uniform3fv(U.uEnvB, state.envB);
  gl.uniform1f(U.uEnvK, state.envK);
  gl.uniform1f(U.uDropMix, state.dropMix);
  gl.uniform1f(U.uDropScale, state.dropScale);
  gl.uniform1f(U.uDropDome, state.dropDome);
  gl.uniform1i(U.uDebug, qs.has("debug") ? parseInt(qs.get("debug")) : 0);
  gl.uniform1f(U.uSpecK, (qs.has("nospec") ? 0 : 1) * state.specK);

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
</script>

<script>
"use strict";
/* ============================================================================
   READINGS — one hidden string, six reads.

   The 2^20 alphanumeric seed is shared with the lcdeath posters (Fibonacci
   word decides digit vs letter, Thue-Morse decides digit parity, Kolakoski
   decides letter parity). Two readers for now, each listening through three
   windows of the string:

   - The Spectral Read: FFT over 32768 symbols. The dominant period drives
     the wave field; the three strongest peaks become the three lights.
   - The Morphic Read: gaps between letters fold toward the golden ratio.
     Golden-angle (137.5 deg) light orbits and hues.

   The string's statistics are stationary (the Fibonacci word is uniformly
   recurrent: the same golden gap ratio at every window), so each listener's
   CHARACTER comes from the statistics and each window's MOMENT comes from the
   FFT phase at that window — palette, light placement, drift and a small
   frequency detune. Six reads = three moments of each listener.

   Every value is deterministic: same string + same window = same state.
   ========================================================================== */
const N_STR = SEED.length;

let CODES = null;
function codes(){
  if (CODES) return CODES;
  CODES = new Uint8Array(N_STR);
  for (let i = 0; i < N_STR; i++){
    const c = SEED.charCodeAt(i);
    CODES[i] = c >= 48 && c <= 57 ? c - 48 : c - 55;
  }
  return CODES;
}

/* radix-2 FFT (in place, destructive) */
function fft(re, im){
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for (let j = 0; j < len / 2; j++){
        const k = i + j, l = i + j + len / 2;
        const tr = re[l] * cr - im[l] * ci;
        const ti = re[l] * ci + im[l] * cr;
        re[l] = re[k] - tr; im[l] = im[k] - ti;
        re[k] += tr; im[k] += ti;
        const ncr = cr * wr - ci * wi, nci = cr * wi + ci * wr;
        cr = ncr; ci = nci;
      }
    }
  }
}

const clamp01 = v => Math.min(1, Math.max(0, v));

function hsl2hex(h, s, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60){ r = c; g = x; }
  else if (h < 120){ r = x; g = c; }
  else if (h < 180){ g = c; b = x; }
  else if (h < 240){ g = x; b = c; }
  else if (h < 300){ r = x; b = c; }
  else { r = c; b = x; }
  const f = v => Math.round((v + m) * 255).toString(16).padStart(2, "0");
  return "#" + f(r) + f(g) + f(b);
}

/* ---------------- The Spectral Read ---------------- */
function spectralRead(offset){
  const C = codes();
  const n = 32768;
  const re = new Float64Array(n);
  const im = new Float64Array(n);
  let mean = 0;
  for (let i = 0; i < n; i++) mean += C[offset + i];
  mean /= n;
  for (let i = 0; i < n; i++) re[i] = C[offset + i] - mean;
  fft(re, im);

  const mag = new Float64Array(n / 2);
  let best = -1, k1 = 1;
  for (let k = 1; k < n / 2; k++){
    const m = re[k] * re[k] + im[k] * im[k];
    mag[k] = m;
    if (m > best){ best = m; k1 = k; }
  }
  const peaks = [];
  for (let k = 2; k < n / 2 - 1; k++){
    if (mag[k] > mag[k - 1] && mag[k] > mag[k + 1] && mag[k] > 0.06 * best){
      peaks.push({ k, m: mag[k], ph: Math.atan2(im[k], re[k]) });
    }
  }
  peaks.sort((a, b) => b.m - a.m);
  while (peaks.length < 3) peaks.push({ k: k1, m: 1, ph: 0 });

  let sumLog = 0, sum = 0;
  for (let k = 1; k < n / 2; k++){
    const v = Math.sqrt(mag[k]) + 1e-12;
    sum += v; sumLog += Math.log(v);
  }
  const flatness = sum > 0 ? Math.exp(sumLog / (n / 2 - 1)) / (sum / (n / 2 - 1)) : 1;
  const flat = clamp01(1 - flatness);           // 1 = strongly structured
  const pkCount = clamp01((peaks.length - 2) / 6);

  const p1 = peaks[0], p2 = peaks[1], p3 = peaks[2];
  const ph1 = p1.ph, ph2 = p2.ph, ph3 = p3.ph;
  const hue1 = (ph1 / (2 * Math.PI)) * 360;
  const hue2 = (ph2 / (2 * Math.PI)) * 360;
  const hue3 = (ph3 / (2 * Math.PI)) * 360;
  const domFrac = clamp01((2 * p1.k) / n);
  const phGap12 = clamp01(Math.abs(ph2 - ph1) / Math.PI); // peak-to-peak phase coherence

  return {
    freq: Math.round(40 + 560 * domFrac + 40 * (ph1 / (2 * Math.PI))),
    gamma: Math.round(2 + 138 * pkCount),
    amp: +(0.4 + 2.1 * flat).toFixed(2),
    hscale: +(0.2 + 1.8 * flat).toFixed(2),
    speed: +(0.05 + 1.95 * clamp01(ph1 / (2 * Math.PI) + 0.5)).toFixed(2),
    disp: +(0.006 + 0.054 * phGap12).toFixed(3),
    web: +(3 * phGap12).toFixed(2),
    expo: +(0.6 + 3.4 * flat).toFixed(2),
    glow: +(0.15 + 1.35 * (1 - flat)).toFixed(2),
    lint: +(0.5 + 2.5 * flat).toFixed(2),
    lsharp: Math.round(45 + 85 * flat),
    lhalo: +(0.08 + 0.27 * (1 - flat)).toFixed(2),
    specK: +(0.3 + 0.7 * flat).toFixed(2),
    dropMix: +(0.2 + 0.8 * clamp01(Math.abs(ph3) / Math.PI)).toFixed(2),
    dropScale: +(4 + 26 * domFrac).toFixed(1),
    dropDome: +(2.1 + 0.5 * clamp01(ph2 / (2 * Math.PI) + 0.5)).toFixed(2),
    orbit: Math.sin(ph1) > 0,
    lightCol: [hsl2hex(hue1, 0.85, 0.55), hsl2hex(hue2, 0.85, 0.55), hsl2hex(hue3, 0.85, 0.55)],
    lightPos: [
      [+(0.7 * Math.cos(ph1)).toFixed(2), +(0.7 * Math.sin(ph1)).toFixed(2), -0.7],
      [+(0.7 * Math.cos(ph2)).toFixed(2), +(0.7 * Math.sin(ph2)).toFixed(2), -1.1],
      [+(0.7 * Math.cos(ph3)).toFixed(2), +(0.7 * Math.sin(ph3)).toFixed(2), -1.4],
    ],
    webCol: hex2rgb(hsl2hex(hue1 + 180, 0.5, 0.7)),
    envA: hex2rgb(hsl2hex(hue1, 0.6, 0.12)),
    envB: hex2rgb(hsl2hex(hue2, 0.6, 0.12)),
    envK: +(0.05 + 0.35 * (1 - flat)).toFixed(2),
  };
}

/* ---------------- The Morphic Read ---------------- */
function morphicRead(offset){
  const C = codes();
  const n = 300000;
  const gaps = [];
  let last = -1;
  for (let i = 0; i < n; i++){
    if (C[offset + i] >= 10){
      if (last >= 0) gaps.push(i - last);
      last = i;
    }
  }
  let n2 = 0, n3 = 0;
  for (const g of gaps){ if (g === 2) n2++; else if (g === 3) n3++; }
  const frac3 = n3 / (n2 + n3 || 1);
  const meanGap = (2 * n2 + 3 * n3) / (n2 + n3 || 1);

  let seq = gaps, folds = 0;
  while (seq.length > 16){
    const next = [];
    let cur = seq[0], run = 1;
    for (let i = 1; i < seq.length; i++){
      if (seq[i] === cur) run++;
      else { next.push(run); cur = seq[i]; run = 1; }
    }
    next.push(run);
    seq = next;
    folds++;
  }

  const golden = 0.6180339887;
  const closeness = clamp01(1 - Math.abs(frac3 - golden) * 12); // 1 = exact golden

  /* Local phase anchor: the string's statistics are stationary (the Fibonacci
     word is uniformly recurrent — the same golden ratio at every window), so
     the window's moment comes from the phase of a short FFT at the window
     start. That phase decides the palette and the light placement. */
  const an = 2048;
  const are = new Float64Array(an);
  const aim = new Float64Array(an);
  let amean = 0;
  for (let i = 0; i < an; i++) amean += C[offset + i];
  amean /= an;
  for (let i = 0; i < an; i++) are[i] = C[offset + i] - amean;
  fft(are, aim);
  let abest = -1, ak1 = 1;
  for (let k = 1; k < an / 2; k++){
    const m = are[k] * are[k] + aim[k] * aim[k];
    if (m > abest){ abest = m; ak1 = k; }
  }
  const aph = Math.atan2(aim[ak1], are[ak1]);
  const h0 = (aph / (2 * Math.PI)) * 360; // the moment's hue

  return {
    freq: Math.round(40 + 560 * (meanGap - 2) + 30 * (aph / (2 * Math.PI))),
    gamma: Math.round(2 + 138 * (1 - closeness)),
    amp: +(0.7 + 1.3 * closeness).toFixed(2),
    hscale: +(0.3 + 1.7 * ((folds % 6) / 5)).toFixed(2),
    speed: +(0.05 + 1.95 * clamp01(aph / (2 * Math.PI) + 0.5)).toFixed(2),
    disp: +(0.006 + 0.054 * closeness).toFixed(3),
    web: +(0.1 + 2.9 * closeness).toFixed(2),
    expo: +(1.4 + 1.2 * closeness).toFixed(2),
    glow: +(0.2 + 0.9 * clamp01((frac3 - 0.45) / 0.25)).toFixed(2),
    lint: +(0.6 + 1.4 * (meanGap - 2)).toFixed(2),
    lsharp: Math.round(45 + 85 * closeness),
    lhalo: +(0.08 + 0.27 * (1 - closeness)).toFixed(2),
    specK: +(0.3 + 0.7 * closeness).toFixed(2),
    dropMix: +(0.3 + 0.7 * clamp01((frac3 - 0.45) / 0.25)).toFixed(2),
    dropScale: +(4 + 26 * clamp01((frac3 - 0.5) * 2.4)).toFixed(1),
    dropDome: +(2.1 + 0.5 * clamp01(aph / (2 * Math.PI) + 0.5)).toFixed(2),
    orbit: true,
    lightCol: [hsl2hex(h0, 0.8, 0.55), hsl2hex(h0 + 137.508, 0.8, 0.55), hsl2hex(h0 + 275.016, 0.8, 0.55)],
    lightPos: [
      [+(0.75 * Math.cos(h0 * Math.PI / 180)).toFixed(2), +(0.75 * Math.sin(h0 * Math.PI / 180)).toFixed(2), -0.8],
      [+(0.6 * Math.cos((h0 + 137.508) * Math.PI / 180)).toFixed(2), +(0.6 * Math.sin((h0 + 137.508) * Math.PI / 180)).toFixed(2), -1.2],
      [+(0.5 * Math.cos((h0 + 275.016) * Math.PI / 180)).toFixed(2), +(0.5 * Math.sin((h0 + 275.016) * Math.PI / 180)).toFixed(2), -1.5],
    ],
    webCol: hex2rgb(hsl2hex(h0 + 180, 0.5, 0.7)),
    envA: hex2rgb(hsl2hex(h0, 0.6, 0.12)),
    envB: hex2rgb(hsl2hex(h0 + 137.508, 0.6, 0.12)),
    envK: +(0.05 + 0.2 * closeness).toFixed(2),
  };
}

/* ---------------- registry + wiring ---------------- */
const READINGS = {
  "spec-1":  { name: "Spectral I",  make: () => spectralRead(0) },
  "spec-2":  { name: "Spectral II", make: () => spectralRead(Math.floor(N_STR / 3)) },
  "spec-3":  { name: "Spectral III", make: () => spectralRead(Math.floor(2 * N_STR / 3)) },
  "morph-1": { name: "Morphic I",   make: () => morphicRead(Math.floor(N_STR / 6)) },
  "morph-2": { name: "Morphic II",  make: () => morphicRead(Math.floor(N_STR / 2)) },
  "morph-3": { name: "Morphic III", make: () => morphicRead(Math.floor(5 * N_STR / 6)) },
};

function applyReading(key){
  if (typeof SEED !== "string"){ alert("seed.js not found — readings unavailable"); return; }
  const rd = READINGS[key];
  if (!rd) return;
  const s = rd.make();
  Object.assign(state, s);
  state.playing = state.playing; // keep
  activeReading = key;
  const sp = $("statepick"); if (sp) sp.value = "r:" + key;
  syncUI();
}

/* URL support: ?reading=spec-2&freeze=2.0 — reading applies after boot's preset,
   then URL tuning overrides apply on top, same semantics as boot.
   Must chain off boot's promise: on file:// the presets.json fetch rejects late
   and boot's applyPreset would otherwise clobber the reading. */
const applyReadingFromURL = () => {
  const rd = qs.get("reading");
  if (rd && READINGS[rd]){
    applyReading(rd);
    for (const k of ["freq","gamma","amp","hscale","speed","disp","web","webOp","expo","glow","lint","orbitSpeed","lsharp","lhalo","dropMix","dropScale","dropDome","specK"])
      if (qs.has(k)) state[k] = parseFloat(qs.get(k));
    syncUI();
  }
};
if (window.__bootDone) window.__bootDone.then(applyReadingFromURL);
else window.addEventListener("load", applyReadingFromURL);

/* ---------------- PNG provenance (uncompressed iTXt after IHDR) ---------------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function pngWithProvenance(buf){
  const dv = new DataView(buf);
  const ihdrLen = dv.getUint32(8);          // first chunk after the 8-byte signature is IHDR
  const insertAt = 8 + 8 + ihdrLen + 4;     // right after the IHDR CRC
  const s = JSON.parse(JSON.stringify(state));
  delete s.playing;
  const meta = JSON.stringify({
    project: "cymatics",
    reading: activeReading,
    state: s,
    seed: SEED.slice(0, 64) + "\u2026",
    seedLen: N_STR,
    generated: new Date().toISOString(),
  });
  const kw = new TextEncoder().encode("cymatics");
  const text = new TextEncoder().encode(meta);
  const data = new Uint8Array(kw.length + 5 + text.length);
  let o = 0;
  data.set(kw, o); o += kw.length;
  data[o++] = 0; // keyword terminator
  data[o++] = 0; // compression flag: uncompressed
  data[o++] = 0; // compression method
  data[o++] = 0; // language tag, empty
  data[o++] = 0; // translated keyword, empty
  data.set(text, o);

  const typeBytes = new Uint8Array([0x69, 0x54, 0x58, 0x74]); // iTXt
  const crcIn = new Uint8Array(4 + data.length);
  crcIn.set(typeBytes, 0);
  crcIn.set(data, 4);
  const crc = crc32(crcIn);

  const out = new Uint8Array(buf.byteLength + 12 + data.length);
  out.set(new Uint8Array(buf, 0, insertAt), 0);
  let p = insertAt;
  const odv = new DataView(out.buffer);
  odv.setUint32(p, data.length); p += 4;
  out.set(typeBytes, p); p += 4;
  out.set(data, p); p += data.length;
  odv.setUint32(p, crc); p += 4;
  out.set(new Uint8Array(buf, insertAt), p);
  return out;
}
